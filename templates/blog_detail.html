{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ blog.title }} — Muhammad Sufyan Khalid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; color: #111; padding: 40px 0; }
        .blog-container { max-width: 800px; background: #fff; border: 1px solid #eaeaea; border-radius: 16px; padding: 40px; margin: auto; box-shadow: 0 1rem 3rem rgba(0,0,0,.04); }
        .blog-img { width: 100%; height: 350px; object-fit: cover; border-radius: 12px; margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="mb-4">
            <a href="{% url 'home' %}" class="text-decoration-none text-dark fw-semibold"><i class="fa-solid fa-arrow-left me-2"></i> Back to Home</a>
        </div>
        <div class="blog-container">
            <span class="text-muted small font-monospace">{{ blog.created_at|date:"F d, Y" }}</span>
            <h1 class="fw-bold display-5 my-3">{{ blog.title }}</h1>
            {% if blog.image %}
                <img src="{{ blog.image.url }}" class="blog-img" alt="{{ blog.title }}">
            {% endif %}
            <div class="text-secondary leading-relaxed mt-4" style="white-space: pre-line; font-size: 1.1rem;">
                {{ blog.content }}
            </div>
        </div>
    </div>
</body>
</html>
